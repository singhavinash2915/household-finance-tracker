name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Serve from https://<owner>.github.io/<repo>/ — derive the base path
        # from the repository name so a fork or rename needs no code change.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      - name: Add SPA + Jekyll guards
        # .nojekyll stops GitHub Pages stripping asset folders; 404.html makes
        # a deep-linked refresh fall back to the app instead of a Pages 404.
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
